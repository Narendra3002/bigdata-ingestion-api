apiVersion: v1
kind: Service
metadata:
  name: bigdata-api-service
spec:
  type: NodePort
  selector:
    app: bigdata-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: bigdata-postgres-service
spec:
  type: ClusterIP
  selector:
    app: bigdata-postgres
  ports:
    - port: 5432
      targetPort: 5432
